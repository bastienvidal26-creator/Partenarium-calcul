<script id="calc">
/* ═════════ FORMULES (testées automatiquement) ═════════
   Taux légaux par défaut. Ils sont remplacés par data/taux.json (taux publiés) puis, si activé, par les taux saisis dans les Réglages. */
const DEFAULTS = { r1:0.60, r2:0.40, thr:2000000, floor:20000, caRatio:0.005, ctr:0.25, isn:0.25, isr:0.15, iscap:42500, tva:0.20 };
const round2 = x => Math.round(x * 100) / 100;

/* Mécénat (art. 238 bis CGI) : réduction d'impôt sur la part du don retenue dans le plafond de l'année ; excédent reportable 5 ans. */
function mecenat(don, ca, P) {
  don = Math.max(0, +don || 0); ca = Math.max(0, +ca || 0);
  const plafond = Math.max(P.floor, P.caRatio * ca);
  const retenu = Math.min(don, plafond);
  const red = x => P.r1 * Math.min(x, P.thr) + P.r2 * Math.max(x - P.thr, 0);
  const reduction = red(retenu), reductionTotale = red(don);
  return { don, plafond, retenu, reportable: don - retenu, reduction,
    reductionReport: reductionTotale - reduction, cost: don - reduction, costApresReport: don - reductionTotale };
}

/* Impôt sur les sociétés d'un bénéfice x (taux réduit PME jusqu'au seuil, taux normal au-delà) */
function isTax(x, P) { x = Math.max(0, x); return P.isr * Math.min(x, P.iscap) + P.isn * Math.max(x - P.iscap, 0); }

/* Parrainage (art. 39-1-7° CGI) : charge déductible, l'économie dépend de l'imposition de l'entreprise. */
function parrainage(ht, o, P) {
  ht = Math.max(0, +ht || 0);
  const tvaNR = o.tvaNR ? ht * P.tva : 0;      // TVA payée et non récupérable : elle devient une charge
  const base = ht + tvaNR;                     // charge déductible
  let saving = 0;
  if (o.regime === "is25") saving = base * P.isn;
  else if (o.regime === "is15") saving = base * P.isr;
  else if (o.regime === "ismix") { const b = Math.max(0, +o.benef || 0); saving = isTax(b, P) - isTax(b - base, P); }
  else if (o.regime === "ir") { const t = +o.tmi || 0, c = +o.soc || 0; saving = base * c + base * (1 - c) * t; }
  else if (o.regime === "micro") saving = 0;   // micro-entreprise : abattement forfaitaire, charges réelles non déductibles
  return { ht, tvaNR, ttc: ht + tvaNR, base, saving, taux: base > 0 ? saving / base : 0, cost: base - saving };
}

/* Recherche du montant qui donne un coût net donné (les coûts sont croissants) */
function invert(costFn, target) {
  target = Math.max(0, +target || 0);
  if (target === 0) return 0;
  let lo = 0, hi = target * 10 + 1;
  while (costFn(hi) < target) hi *= 2;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (costFn(mid) < target) lo = mid; else hi = mid; }
  return hi;
}
/* Montant entier en euros le plus élevé dont le coût net ne dépasse pas le budget */
function fitBudget(costFn, budget) {
  budget = Math.max(0, +budget || 0);
  let d = Math.floor(invert(costFn, budget));
  if (costFn(d + 1) <= budget + 1e-9) d++;
  while (d > 0 && costFn(d) > budget + 1e-9) d--;
  return d;
}
const donFromBudget = (budget, ca, P) => fitBudget(d => mecenat(d, ca, P).cost, budget);
const htFromBudget = (budget, o, P) => fitBudget(m => parrainage(m, o, P).cost, budget);
if (typeof module !== "undefined") module.exports = { DEFAULTS, mecenat, isTax, parrainage, invert, donFromBudget, htFromBudget };
</script>

/* ═════════ stockage sur le téléphone : IndexedDB (secours localStorage) ═════════ */
const store = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(CONFIG.key, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function get(k) {
    try {
      const db = await open();
      return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch { return lsGet(CONFIG.key + ":" + k); }
  }
  async function set(k, v) {
    try {
      const db = await open();
      await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
    } catch {
      try { localStorage.setItem(CONFIG.key + ":" + k, JSON.stringify(v)); } catch { toast("Stockage du téléphone plein."); }
    }
  }
  return { get, set };
})();

function save(key) { clearTimeout(saveT[key]); saveT[key] = setTimeout(() => store.set(key, S[key]), 250); }
function putItem(id, data) {
  if (data === null) { delete S.items[id]; S.del[id] = Date.now(); }
  else { data.updated = Date.now(); S.items[id] = data; delete S.del[id]; }
  save("items"); save("del"); syncSoon();
}

/* ═════════ taux publics : fichier data/taux.json servi par GitHub Pages ═════════ */
async function loadPublic() {
  try {
    const r = await fetch("./data/taux.json", { cache:"no-cache" });
    if (!r.ok) throw 0;
    const d = await r.json(); if (!d || !d.taux) throw 0;
    S.pub = d; S.pubSrc = navigator.onLine ? "fichier publié" : "copie locale"; store.set("pub", d);
    if (S.view === "set" && !isTyping()) render(); else update();
  } catch {} // hors ligne : on garde la copie locale
}
const isTyping = () => { const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); };

/* ═════════ calculs de l'écran ═════════ */
const REG = { is25:"Société à l'IS, taux normal", is15:"PME à l'IS, taux réduit", ismix:"PME à l'IS, selon son bénéfice", ir:"Entreprise individuelle au réel (IR)", micro:"Micro-entreprise" };
const parOpts = () => ({ regime:S.calc.regime, benef:S.calc.benef, tmi:S.calc.tmi, soc:S.calc.soc, tvaNR:S.calc.tvaNR });
function calcMec() {
  const P = rates(), c = S.calc;
  const don = c.mecMode === "budget" ? donFromBudget(c.mecBudget, c.ca, P) : c.mecDon;
  return { P, r: mecenat(don, c.ca, P) };
}
function calcPar() {
  const P = rates(), c = S.calc, o = parOpts();
  const ht = c.parMode === "budget" ? htFromBudget(c.parBudget, o, P) : c.parMt;
  return { P, o, r: parrainage(ht, o, P) };
}
function calcCmp() {
  const P = rates(), c = S.calc, o = parOpts(), x = Math.max(0, c.cmpMt), s = c.split / 100;
  return { P, o, x, s, m: mecenat(x, c.ca, P), p: parrainage(x, o, P), mm: mecenat(x * s, c.ca, P), pp: parrainage(x * (1 - s), o, P) };
}
const SIGN = P => `Simulation indicative Partenarium (${ratesLabel()}), à confirmer par l'expert-comptable de l'entreprise.`;
function summary(kind) {
  if (kind === "mec") {
    const { P, r } = calcMec();
    let t = `Mécénat — don de ${eur(r.don)} à un organisme d'intérêt général\nRéduction d'impôt : ${eur(r.reduction)} (${pct(P.r1)}, art. 238 bis CGI)\nCoût réel pour l'entreprise : ${eur(r.cost)}`;
    if (r.reportable > 0) t += `\nPlafond de l'année : ${eur(r.plafond)} ; réduction reportable sur 5 ans : ${eur(r.reductionReport)} (coût final ${eur(r.costApresReport)})`;
    return { t: t + "\n" + SIGN(P), label:"Coût réel", big:eur(r.cost), sub:`Don ${eur(r.don)} · réduction ${eur(r.reduction)}`, amount:r.don };
  }
  if (kind === "par") {
    const { P, o, r } = calcPar();
    let t = `Parrainage — ${eur(r.ht)} HT${o.tvaNR ? ` + TVA non récupérable ${eur(r.tvaNR)}` : ""}\nCharge déductible (art. 39-1-7° CGI) · ${REG[o.regime]}\nÉconomie d'impôt : ${eur(r.saving)}\nCoût net pour l'entreprise : ${eur(r.cost)}`;
    return { t: t + "\n" + SIGN(P), label:"Coût net", big:eur(r.cost), sub:`Parrainage ${eur(r.ht)} HT · économie ${eur(r.saving)}`, amount:r.ht };
  }
  const k = calcCmp();
  const t = `Pour ${eur(k.x)} versés au projet :\n• en mécénat : coût réel ${eur(k.m.cost)}\n• en parrainage : coût net ${eur(k.p.cost)} (${REG[k.o.regime]})\n• en montage mixte (${Math.round(k.s * 100)} % mécénat) : ${eur(k.mm.cost + k.pp.cost)}`;
  return { t: t + "\n" + SIGN(k.P), label:"Comparaison", big:`${eur(k.m.cost)} / ${eur(k.p.cost)}`, sub:`Pour ${eur(k.x)} : mécénat / parrainage`, amount:k.x };
}

/* Mise à jour des résultats SANS re-dessiner l'écran (on ne perd ni le clavier ni la saisie) */
const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
const html = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
const show = (id, on) => { const e = document.getElementById(id); if (e) e.hidden = !on; };
const rowsHtml = rows => rows.map(([a, b, strong]) => `<div class="row"><span class="k">${a}</span><span class="v num${strong ? " strong" : ""}">${b}</span></div>`).join("");
function bar(parts) { // parts : [[valeur, classe, libellé, couleur]]
  const tot = parts.reduce((s, p) => s + Math.max(0, p[0]), 0) || 1;
  html("bar", parts.map(p => `<i class="${p[1]}" style="width:${(Math.max(0, p[0]) / tot * 100).toFixed(2)}%"></i>`).join(""));
  html("legend", parts.filter(p => p[0] > 0.5).map(p => `<span style="--d:${p[3]}">${p[2]} ${pct(p[0] / tot)}</span>`).join(""));
}
function update() {
  const v = S.view, c = S.calc;
  if (v === "mec") {
    const { P, r } = calcMec();
    if (c.mecMode === "budget") { set("h-lab", "Don possible pour ce budget"); set("h-big", eur(r.don)); set("h-sub", `Réduction d'impôt ${eur(r.reduction)} · coût réel ${eur(r.cost)}`); }
    else { set("h-lab", "Coût réel pour l'entreprise"); set("h-big", eur(r.cost)); set("h-sub", `Don ${eur(r.don)} − réduction d'impôt ${eur(r.reduction)}`); }
    bar([[r.cost, "c", "Coût réel", "#fff"], [r.reduction, "r", "Réduction d'impôt", "#34C759"]]);
    show("a-plaf", r.reportable > 0);
    if (r.reportable > 0) set("a-plaf", `Plafond de l'année : ${eur(r.plafond)} (${eur(P.floor)} ou ${String(P.caRatio * 1000).replace(".", ",")} ‰ du CA HT). Les ${eur(r.reportable)} au-delà ouvrent une réduction de ${eur(r.reductionReport)}, reportable sur les 5 exercices suivants. Coût final si le report est utilisé : ${eur(r.costApresReport)}.`);
    const ct = c.contre, over = r.don > 0 && ct > P.ctr * r.don;
    show("a-ctr", over);
    if (over) set("a-ctr", `Contreparties de ${eur(ct)}, soit ${pct(ct / r.don)} du don : au-delà de ${pct(P.ctr)} (rapport de 1 à 4 admis par l'administration), le don risque d'être requalifié en parrainage et de perdre la réduction d'impôt.`);
    set("ctr-info", r.don > 0 && ct > 0 && !over ? `${pct(ct / r.don)} du don, sous la limite de ${pct(P.ctr)}` : `Limite admise : ${pct(P.ctr)} du don (${eur(P.ctr * r.don)})`);
    html("d-mec", rowsHtml([
      ["Don versé", eur(r.don)],
      ["Plafond de l'année", eur(r.plafond)],
      ["Don retenu cette année", eur(r.retenu)],
      [`Réduction d'impôt (${pct(P.r1)}${r.retenu > P.thr ? `, puis ${pct(P.r2)}` : ""})`, "− " + eur(r.reduction)],
      ["Coût réel cette année", eur(r.cost), true],
      ...(r.reportable > 0 ? [["Réduction reportable (5 ans)", eur(r.reductionReport)], ["Coût final après report", eur(r.costApresReport), true]] : [])
    ]));
  } else if (v === "par") {
    const { o, r } = calcPar();
    if (c.parMode === "budget") { set("h-lab", "Parrainage possible pour ce budget"); set("h-big", eur(r.ht)); set("h-sub", `HT · économie d'impôt ${eur(r.saving)} · coût net ${eur(r.cost)}`); }
    else { set("h-lab", "Coût net pour l'entreprise"); set("h-big", eur(r.cost)); set("h-sub", `Parrainage ${eur(r.ht)} HT − économie d'impôt ${eur(r.saving)}`); }
    bar([[r.cost, "c", "Coût net", "#fff"], [r.saving, "r", "Économie d'impôt", "#34C759"]]);
    show("f-benef", o.regime === "ismix"); show("f-ir", o.regime === "ir");
    show("a-micro", o.regime === "micro");
    set("reg-hint", { is25:"Société à l'IS dont le bénéfice dépasse 42 500 €, ou qui n'a pas droit au taux réduit.", is15:"Taux réduit sur les 42 500 premiers euros de bénéfice, sous conditions (dont CA ≤ 10 M€, groupe compris).", ismix:"Calcul exact : 15 % jusqu'à 42 500 € de bénéfice, 25 % au-delà.", ir:"Le parrainage réduit l'impôt sur le revenu et les cotisations sociales de l'entrepreneur.", micro:"Charges réelles non déductibles en micro-entreprise : aucune économie d'impôt." }[o.regime]);
    html("d-par", rowsHtml([
      ["Montant HT", eur(r.ht)],
      ...(o.tvaNR ? [["TVA non récupérable", eur(r.tvaNR)]] : []),
      ["Charge déductible", eur(r.base)],
      [`Économie d'impôt (${pct(r.taux)} effectif)`, "− " + eur(r.saving)],
      ["Coût net", eur(r.cost), true]
    ]));
  } else if (v === "cmp") {
    const k = calcCmp();
    set("c-mec", eur(k.m.cost)); set("c-mec-s", `réduction ${eur(k.m.reduction)}`);
    set("c-par", eur(k.p.cost)); set("c-par-s", `économie ${eur(k.p.saving)}`);
    $("#t-mec")?.classList.toggle("best", k.m.cost < k.p.cost - 0.5);
    $("#t-par")?.classList.toggle("best", k.p.cost < k.m.cost - 0.5);
    set("split-l", `${Math.round(k.s * 100)} % mécénat · ${Math.round((1 - k.s) * 100)} % parrainage`);
    set("c-mix", eur(k.mm.cost + k.pp.cost));
    set("c-mix-s", `${eur(k.x * k.s)} de don (coût ${eur(k.mm.cost)}) + ${eur(k.x * (1 - k.s))} de parrainage (coût ${eur(k.pp.cost)})`);
    const gap = Math.abs(k.p.cost - k.m.cost);
    html("c-say", `Pour <b>${eur(k.x)}</b> versés au projet, votre coût réel est de <b>${eur(k.m.cost)}</b> en mécénat ou de <b>${eur(k.p.cost)}</b> en parrainage${gap >= 1 ? `, soit ${eur(gap)} d'écart` : ""}.`);
    show("f-benef", k.o.regime === "ismix");
    show("a-plaf-c", k.m.reportable > 0);
    if (k.m.reportable > 0) set("a-plaf-c", `En mécénat, ${eur(k.m.reportable)} dépassent le plafond de l'année (${eur(k.m.plafond)}) : la réduction correspondante est reportée sur 5 ans, d'où un coût plus élevé la première année.`);
  }
}

  try { await navigator.clipboard.writeText(text); toast("Résumé copié : collez-le dans un SMS ou un mail."); }

}

/* ═════════ import d'image (logo, depuis la galerie ou l'appareil photo) ═════════ */
async function processImage(file, target) {
  if (!file) return;
  if (/heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "")) { toast("Format HEIC non lu par le navigateur : choisissez une image JPEG ou PNG."); return; }
  if (file.type && !file.type.startsWith("image/")) { toast("Ce fichier n'est pas une image."); return; }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = 256, c = document.createElement("canvas"); c.width = W; c.height = W;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, W);
    const s = Math.min((W - 24) / img.naturalWidth, (W - 24) / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
    g.drawImage(img, (W - w) / 2, (W - h) / 2, w, h); // logo entier, centré sur fond blanc
    const data = c.toDataURL("image/jpeg", 0.85); // quelques Ko
    if (target === "draft") { S.draftImg = data; const pv = $("#draftpv"); if (pv) { pv.src = data; pv.hidden = false; } } // pas de render() : on garderait le texte tapé
    else if (S.items[target]) { putItem(target, { ...S.items[target], img:data }); const box = $("#dlogo"); if (box) box.innerHTML = avatar(S.items[target]); }
    toast("Image enregistrée.");
  } catch { toast("Image illisible."); }
  finally { URL.revokeObjectURL(url); }
}

  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);

async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d.items !== "object") throw 0;
    let n = 0;
    for (const [id, it] of Object.entries(d.items || {})) { const cur = S.items[id]; if (!cur || (it.updated || 0) >= (cur.updated || 0)) { S.items[id] = it; delete S.del[id]; n++; } }
    save("items"); save("del"); syncSoon(); render(); toast(`${n} dossier(s) importé(s).`);
  } catch { toast("Ce fichier n'est pas une sauvegarde valide."); }
}

   Le jeton reste dans le navigateur du téléphone (localStorage), jamais dans le code. */
const GH = { token: lsGet(CONFIG.key + ":gh") || "" };

    headers:{ "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "Authorization":`Bearer ${GH.token}`, "X-GitHub-Api-Version":"2022-11-28", ...(opts.body ? { "Content-Type":"application/json" } : {}) }

}

async function getRemote(path) {
  let meta; try { meta = await gh(`/contents/${path}`); } catch (e) { if (e.status === 404) return { data:null, sha:null }; throw e; }
  let data = null; try { data = JSON.parse(await gh(`/contents/${path}`, {}, true)); } catch {}
  return { data, sha:meta.sha };
}
function putRemote(path, obj, sha) {
  const body = { message:`${CONFIG.name} : synchronisation`, content:b64(JSON.stringify(obj)) }; if (sha) body.sha = sha;
  return gh(`/contents/${path}`, { method:"PUT", body:JSON.stringify(body) });
}
/* Fusion : pour chaque dossier, la version la plus récente gagne ; une suppression plus récente l'emporte. */
function merge(local, remote, ldel, rdel, flags) {
  const out = {}, del = {};
  for (const id of new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(ldel), ...Object.keys(rdel)])) {
    const l = local[id], r = remote[id], d = Math.max(ldel[id] || 0, rdel[id] || 0);
    const best = (l?.updated || 0) >= (r?.updated || 0) ? (l || r) : r;
    if (best && (best.updated || 0) >= d) out[id] = best; else if (d) del[id] = d;
    if (out[id] !== l || (del[id] || 0) !== (ldel[id] || 0)) flags.local = true;
    if (out[id] !== r || (del[id] || 0) !== (rdel[id] || 0)) flags.remote = true;
  }
  return { out, del };
}
async function syncNow(manual, retry) {
  if (!GH.token || !navigator.onLine || SYNC.busy) { if (manual && !GH.token) toast("Ajoutez d'abord votre jeton GitHub."); return; }
  SYNC.busy = true; SYNC.err = "";
  try {
    const rem = await getRemote("donnees.json"), R = rem.data || {}, fl = { local:false, remote:!rem.sha };
    const m = merge(S.items, R.items || {}, S.del, R.del || {}, fl);
    if (fl.local) { S.items = m.out; S.del = m.del; save("items"); save("del"); if (!isTyping() && ["dos", "dossier"].includes(S.view)) render(); }
    if (fl.remote || SYNC.dirty) await putRemote("donnees.json", { v:1, updated:Date.now(), items:m.out, del:m.del }, rem.sha);
    SYNC.dirty = false; SYNC.last = Date.now(); lsSet(CONFIG.key + ":lastsync", SYNC.last);
    if (manual) toast("Synchronisé.");
  } catch (e) {
    SYNC.busy = false;
    if ((e.status === 409 || e.status === 422) && !retry) return syncNow(manual, true); // conflit : on relit et on refusionne
    SYNC.err = e.status === 404 ? "Dépôt privé introuvable, ou le jeton n'y a pas accès." : (e.status === 401 || e.status === 403) ? "Jeton invalide ou sans la permission Contents (lecture et écriture)." : "Synchronisation impossible pour le moment.";
    if (manual) toast(SYNC.err);
  }
  SYNC.busy = false; if (S.view === "set" && !isTyping()) render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - SYNC.last > 60000) syncNow(); });

/* ═════════ démarrage ═════════ */
async function boot() {
  const [items, del, pub, calc, ovr] = await Promise.all(["items", "del", "pub", "calc", "ovr"].map(k => store.get(k)));
  S.items = items || {}; S.del = del || {};
  if (pub && pub.taux) { S.pub = pub; S.pubSrc = "copie locale"; }
  S.calc = { ...CALC0, ...(calc || {}) };
  if (ovr) S.ovr = ovr;
  if (!["mec", "par", "cmp", "dos", "set"].includes(S.view)) S.view = "mec";
  try { history.replaceState({ v:S.view }, ""); } catch {}
  render();
  loadPublic();
  syncNow();
  if ("serviceWorker" in navigator) {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("./sw.js");
      reg.update && reg.update(); // vérifie tout de suite s'il existe une nouvelle version
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        // nouvelle version installée : recharge une fois (sauf premier lancement ou saisie en cours)
        if (!hadController || reloaded) return; reloaded = true;
        if (!isTyping()) location.reload();
      });
    } catch {}
  }
  // demande au navigateur de ne pas effacer les données en cas de manque de place
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch {} }
}
boot();
})();
